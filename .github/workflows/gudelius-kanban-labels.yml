name: Gudelius Kanban Labels

on:
  push:
    paths:
      - ".github/workflows/gudelius-kanban-labels.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Kanban labels and apply issue metadata
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "status: offen", color: "D4C44D", description: "Noch nicht begonnen" },
              { name: "status: in-arbeit", color: "4F8FB0", description: "Aktiv in Bearbeitung" },
              { name: "status: wartet", color: "D7A64A", description: "Wartet auf Zuarbeit oder Abhängigkeit" },
              { name: "status: erledigt", color: "5A9A6A", description: "Abgeschlossen" },
              { name: "verantwortlich: basti", color: "8BC49A", description: "Verantwortlich: Basti" },
              { name: "verantwortlich: jost", color: "8FB5C7", description: "Verantwortlich: Jost" },
              { name: "gudelius-beta", color: "E5C533", description: "Gudelius Version 3 Beta" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  throw error;
                }
              }
            }

            if (context.eventName === "issues" && context.payload.issue) {
              const body = context.payload.issue.body || "";
              const issueNumber = context.payload.issue.number;
              const add = ["gudelius-beta"];

              if (/Status:\s*Wartet/i.test(body)) add.push("status: wartet");
              else if (/Status:\s*In Arbeit/i.test(body)) add.push("status: in-arbeit");
              else if (/Status:\s*Erledigt/i.test(body)) add.push("status: erledigt");
              else add.push("status: offen");

              if (/Verantwortlich:\s*Jost/i.test(body)) add.push("verantwortlich: jost");
              if (/Verantwortlich:\s*Basti/i.test(body)) add.push("verantwortlich: basti");

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: add
              });
            }
